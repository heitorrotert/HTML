<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clube Patinhas</title>
    </head>
    <body>
        <h1>Clube Patinhas</h1> <!-- h1 é uma tag de título -->
        <!-- Um único h1 por página: o assunto principal-->
        <!-- Existem seis níveis de título, do h1 ao h6-->
        <!-- Não se pula ordem: depois de h1, vem um h2, depois h3, etc.-->
        <h2> Como cuidar</h2>
        <h3>Alimentação</h3>
        <p>Escove os dentes <em>só com pasta para cães</em>.</p>
        <h3>Passeios</h3>
        <p>Filhotes só passeiam <strong>com as vacinas em dia</strong>.</p>
        <!-- A tagp é para parágrafo de texto -->
        <!-- A tag atrong é para uso de negrito e em para itálico -->
        <ol> 
            <li>Pegar a guia</li>
            <li>Passear</li>
            <li>Dar água</li>
        </ol>
        <!-- Lista ordenada.-->
        <!-- A tag ol abre a lista e li são os elementos desta lista -->
        <h2>Raças</h2>
        <ul>
            <li>Beagle</li>
            <li>Poodle</li>
            <li>Vira-lata</li>
        </ul>
        <!-- Lista não ordenada. -->
        <!-- A tag ul abre a lista e li são os elementos desta lista -->
        
        <dl>
            <dt>Filhote</dt>
            <dd>Cão com menos de um ano.</dd>
        </dl>
        <!-- Usado para criar uma definição. -->
        <!-- A tag dt é para o título e dd para descrição -->
        <a href="https://pt.wikipedia.org/wiki/C%C3%A3o" target="_blank" rel="noopener noreferrer">Sobre cães - Wikipédia</a>
        <!-- A tag a é para criar links -->
        <!-- No atributo href, colocamos o endereço da página que queremos redirecionar -->
        <!-- O atributo target é usado para indicar se, ao clicar no link, a página abrirá na mesma aba/janela ou em uma nova aba/janela -->
        <!-- O atributo rel="noopener noreferrer" define que, ao clicar no link e abrir uma nova aba, ele não poderá manipular a aba original(reverse tabnabbing) e impedirá o acesso à página que o site de destino saiba de qual página veio o tráfego original -->
        <img src="golden_retriever.jpg" alt="Golden Retriever: O cachorro mais bonito do mundo."> 
        <!-- A tag img é para inserir imagens -->
        <!-- O atributo src é usado para indicar o caminho da imagem -->
        <!-- O atributo alt é usado para indicar um texto alternativo, caso a imagem não seja -->
         
    </body>
</html>
